name: Deploy site to GitHub Pages

# Publishes the static site so you get a live preview URL.
# One-time setup: in the repo, go to Settings → Pages → Build and deployment
# → Source: "GitHub Actions". After that, every push here auto-deploys.

on:
  push:
    branches:
      - main
      - claude/dazzling-hypatia-ixgic5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
