      <stop offset="0" stop-color="#E84750"/><stop offset=".55" stop-color="#C8202A"/><stop offset="1" stop-color="#6E1015"/>
    </linearGradient>
    <linearGradient id="mmkSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cdcdd3"/><stop offset=".58" stop-color="#9a9aa1"/><stop offset="1" stop-color="#e8e8ea"/>
